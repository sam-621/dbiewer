type User {
  id: ID!
  name: String!
  email: String!
  image: String
}

type Workspace {
  id: ID!
  name: String!
}

type Me {
  user: User!
  workspace: Workspace
}

type Query {
  me: Me
}

input CreateWorkspaceInput {
  name: String!
}

type WorkspaceResult {
  apiErrors: [WorkspaceErrorResult!]!
  workspace: Workspace
}

type WorkspaceErrorResult {
  code: WorkspaceErrorCode!
  message: String!
}

enum WorkspaceErrorCode {
  WORKSPACE_ALREADY_EXISTS
}

input UpdateUserProfileInput {
  name: String!
}

type UserResult {
  apiErrors: [UserErrorResult!]!
  user: User
}

type UserErrorResult {
  code: UserErrorCode!
  message: String!
}

enum UserErrorCode {
  USER_NAME_REQUIRED
  USER_NAME_TOO_LONG
}

type Mutation {
  createWorkspace(input: CreateWorkspaceInput!): WorkspaceResult!
  updateUserProfile(input: UpdateUserProfileInput!): UserResult!
}
