type DbSchema {
  name: String!
  tables: [DbTable!]!
  views: [DbView!]!
  functions: [DbFunction!]!
}

type DbTable {
  name: String!
  estimatedRows: Int
  columns: [DbColumn!]!
}

type DbView {
  name: String!
  columns: [DbColumn!]!
}

type DbColumn {
  name: String!
  type: String!
  isPrimaryKey: Boolean!
  isForeignKey: Boolean!
}

type DbFunction {
  name: String!
  arguments: String!
  kind: DbFunctionKind!
}

enum DbFunctionKind {
  FUNCTION
  PROCEDURE
}

type ConnectionSchemaResult {
  apiErrors: [ShellErrorResult!]!
  schemas: [DbSchema!]
}

input DbObjectInput {
  connectionId: ID!
  schema: String!
  name: String!
}

type DbTableStructure {
  columns: [DbColumnDetail!]!
  indexes: [DbIndex!]!
  foreignKeys: [DbForeignKey!]!
  definition: String!
}

type DbColumnDetail {
  name: String!
  type: String!
  isNullable: Boolean!
  default: String
  isPrimaryKey: Boolean!
}

type DbIndex {
  name: String!
  definition: String!
  isUnique: Boolean!
}

type DbForeignKey {
  columns: [String!]!
  referencedSchema: String!
  referencedTable: String!
  referencedColumns: [String!]!
  onDelete: String!
}

input TableRowsInput {
  connectionId: ID!
  schema: String!
  name: String!
  where: String
  orderBy: String
  page: Int!
}

type DbResultColumn {
  name: String!
  type: String!
}

type TableRows {
  columns: [DbResultColumn!]!
  rows: [[String]!]!
  totalRows: Int!
}

type TableStructureResult {
  apiErrors: [ShellErrorResult!]!
  structure: DbTableStructure
}

type TableRowsResult {
  apiErrors: [ShellErrorResult!]!
  tableRows: TableRows
}

input FunctionDefinitionInput {
  connectionId: ID!
  schema: String!
  name: String!
  arguments: String!
}

type FunctionDefinitionResult {
  apiErrors: [ShellErrorResult!]!
  definition: String
}

enum DiagramRelationType {
  ONE_TO_ONE
  MANY_TO_ONE
  MANY_TO_MANY
}

type DiagramProperty {
  name: String!
  type: String!
  default: String
  isNullable: Boolean!
  isPrimaryKey: Boolean!
  isForeignKey: Boolean!
}

type DiagramEntity {
  id: ID!
  schema: String!
  name: String!
  properties: [DiagramProperty!]!
}

type DiagramRelation {
  id: ID!
  type: DiagramRelationType!
  fromEntityId: ID!
  fromProperties: [String!]!
  toEntityId: ID!
  toProperties: [String!]!
}

type SchemaDiagram {
  entities: [DiagramEntity!]!
  relations: [DiagramRelation!]!
}

type SchemaDiagramResult {
  apiErrors: [ShellErrorResult!]!
  diagram: SchemaDiagram
}

type ShellErrorResult {
  code: ShellErrorCode!
  message: String!
}

enum ShellErrorCode {
  INVALID_INPUT
  CONNECTION_NOT_FOUND
  CONNECTION_FAILED
  OBJECT_NOT_FOUND
  QUERY_FAILED
}

type Query {
  connectionSchema(connectionId: ID!): ConnectionSchemaResult!
  tableStructure(input: DbObjectInput!): TableStructureResult!
  tableRows(input: TableRowsInput!): TableRowsResult!
  functionDefinition(input: FunctionDefinitionInput!): FunctionDefinitionResult!
  schemaDiagram(connectionId: ID!): SchemaDiagramResult!
}
