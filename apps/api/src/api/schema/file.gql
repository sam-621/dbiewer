scalar DateTime

enum FileType {
  SQL
  TXT
}

type File {
  id: ID!
  name: String!
  type: FileType!
  content: String!
  updatedAt: DateTime!
}

type FileList {
  items: [File!]!
}

type Query {
  files(connectionId: ID!): FileList!
  file(id: ID!): File
}

input SaveFileInput {
  id: ID
  connectionId: ID!
  name: String!
  type: FileType!
  content: String!
}

type FileResult {
  apiErrors: [FileErrorResult!]!
  file: File
}

type RemoveFileResult {
  apiErrors: [FileErrorResult!]!
  success: Boolean
}

type FileErrorResult {
  code: FileErrorCode!
  message: String!
}

enum FileErrorCode {
  INVALID_INPUT
  CONNECTION_NOT_FOUND
  FILE_NOT_FOUND
  FILE_NAME_ALREADY_EXISTS
}

type Mutation {
  saveFile(input: SaveFileInput!): FileResult!
  removeFile(id: ID!): RemoveFileResult!
}
